[mypy]
python_version = 3.12
ignore_missing_imports = True
implicit_optional = True
# follow_imports=silent: mypy revisa només els fitxers passats com a argument.
# Aixo evita inundar-se d'errors pre-existents a la resta del codi vell.
follow_imports = silent
check_untyped_defs = False
disallow_untyped_defs = False
# Mantenim attr-defined I union-attr ACTIUS — son els que atrapen el bug del
# 28/06 (.isoformat() sobre un valor str|date|datetime).
disable_error_code = var-annotated, no-any-return, no-redef, return-value, assignment, operator, call-overload
