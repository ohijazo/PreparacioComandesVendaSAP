name: CI

# NOTA (2026-07-27): trigger automàtic desactivat.
#
# Els tests requereixen els mòduls compartits `models.py`, `regles.py` i
# `mailer.py` del repo germà `preparacioComandesVenda` (Kais), que es carreguen
# via `_bootstrap.py` amb `KAIS_APP_PATH`. Aquest repo NO està publicat a GitHub,
# per tant el runner d'Ubuntu no hi té accés i els tests peten amb:
#     RuntimeError: KAIS_APP_PATH no existeix
#
# Fins que es decideixi una estratègia (publicar Kais amb token secret, copiar
# els 3 mòduls al repo SAP trencant compartició, o empaquetar-los com a pip
# package), el CI només es pot disparar manualment via workflow_dispatch per
# revisió puntual quan hi hagi context.
#
# Els tests SÍ es corren localment a l'entorn de dev (Windows amb Kais al mateix
# disc P:) — 71 tests, pytest OK.

on:
  workflow_dispatch:  # només manual, no automàtic

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps (pyodbc needs unixODBC headers)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

      - name: Run mypy sobre fitxers anotats (contracte data_carrega)
        run: mypy motor.py consultes.py
