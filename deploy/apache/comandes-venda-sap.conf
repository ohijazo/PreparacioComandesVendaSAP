# =============================================================================
# Apache VirtualHost - Motor Preparació Comandes Venda (variant SAP)
# =============================================================================
# Destinació al servidor: /etc/apache2/sites-available/comandes-venda-sap.conf
# Activar amb: sudo a2ensite comandes-venda-sap.conf && sudo systemctl reload apache2
#
# Decisió del 2026-09-30: les dues variants conviuen amb noms propis. Kais manté
# `comandes.agrienergia.local` sense que se li toqui res, i SAP té el seu.
#
# Es pot activar ABANS que el DNS existeixi, sense afectar ningú: Apache només
# encamina pel `Host` que li arriba, i cap client enviarà aquest nom fins que
# resolgui. Mentrestant es pot validar tot el camí amb `curl -H "Host: ..."`.
# =============================================================================

<VirtualHost *:80>
    ServerName comandessap.agrienergia.local

    # Patró consistent amb Kais: permetre barres codificades a la URL (números
    # de sèrie amb caràcters especials, etc.).
    AllowEncodedSlashes NoDecode

    ProxyPreserveHost On

    # L'exclusió ha d'anar ABANS del ProxyPass general. Sense ella, mod_proxy
    # s'empassa també /static/ i l'Alias de més avall queda mort: mod_proxy
    # resol la ruta abans que mod_alias. Comprovat el 30-09-2026 — el CSS
    # tornava amb `Server: gunicorn` i un ETag de Flask.
    ProxyPass /static/ !

    ProxyPass / http://127.0.0.1:5002/ nocanon
    ProxyPassReverse / http://127.0.0.1:5002/

    # Servir fitxers estàtics directament, sense passar per Gunicorn.
    Alias /static/ /var/www/comandes-venda-sap/static/
    <Directory /var/www/comandes-venda-sap/static/>
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/comandes-venda-sap-error.log
    CustomLog ${APACHE_LOG_DIR}/comandes-venda-sap-access.log combined
</VirtualHost>
